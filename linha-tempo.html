<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Uma Vida em Momentos</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: Georgia, "Times New Roman", serif;
        background: #080604;
      }

      /* =====================================================
       TIMELINE
    ===================================================== */

      .timeline {
        position: relative;

        width: 100vw;
        height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        overflow: hidden;

        background: radial-gradient(
          circle at center,
          #3b2a19 0%,
          #1c130d 45%,
          #080604 100%
        );

        transition: background 3s ease, opacity 1.5s ease;
      }

      .timeline::before {
        content: "";

        position: absolute;

        width: 80vw;
        height: 80vh;

        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%);

        background: radial-gradient(
          circle,
          rgba(218, 178, 90, 0.16),
          transparent 65%
        );

        filter: blur(45px);

        pointer-events: none;
      }

      .timeline::after {
        content: "";

        position: absolute;

        inset: 0;

        background: radial-gradient(
          circle at center,
          transparent 45%,
          rgba(0, 0, 0, 0.48) 100%
        );

        pointer-events: none;

        z-index: 2;
      }

      .timeline.quente {
        background: radial-gradient(
          circle at center,
          #63372e 0%,
          #321914 48%,
          #0b0605 100%
        );
      }

      /* =====================================================
       CONFETES
    ===================================================== */

      .confetes {
        position: absolute;

        inset: 0;

        overflow: hidden;

        pointer-events: none;

        z-index: 3;
      }

      .confete {
        position: absolute;

        top: -20px;

        width: 5px;
        height: 8px;

        border-radius: 2px;

        background: rgba(235, 205, 135, 0.45);

        opacity: 0.5;

        animation: cairConfete linear infinite;
      }

      .confete:nth-child(1) {
        left: 8%;
        animation-duration: 9s;
      }

      .confete:nth-child(2) {
        left: 20%;
        animation-duration: 12s;
        animation-delay: 2s;
      }

      .confete:nth-child(3) {
        left: 33%;
        animation-duration: 10s;
        animation-delay: 4s;
      }

      .confete:nth-child(4) {
        left: 47%;
        animation-duration: 13s;
        animation-delay: 1s;
      }

      .confete:nth-child(5) {
        left: 61%;
        animation-duration: 11s;
        animation-delay: 3s;
      }

      .confete:nth-child(6) {
        left: 73%;
        animation-duration: 14s;
        animation-delay: 5s;
      }

      .confete:nth-child(7) {
        left: 85%;
        animation-duration: 10s;
        animation-delay: 2s;
      }

      .confete:nth-child(8) {
        left: 94%;
        animation-duration: 15s;
        animation-delay: 6s;
      }

      @keyframes cairConfete {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 0;
        }

        10% {
          opacity: 0.5;
        }

        50% {
          transform: translateY(50vh) translateX(12px) rotate(180deg);
        }

        90% {
          opacity: 0.3;
        }

        100% {
          transform: translateY(110vh) translateX(-10px) rotate(360deg);
          opacity: 0;
        }
      }

      /* =====================================================
       CORAÇÕES
    ===================================================== */

      .coracoes {
        position: absolute;

        inset: 0;

        overflow: hidden;

        pointer-events: none;

        z-index: 4;

        opacity: 0;

        transition: opacity 3s ease;
      }

      .timeline.quente .coracoes {
        opacity: 1;
      }

      .coracao {
        position: absolute;

        bottom: -40px;

        color: rgba(255, 190, 180, 0.42);

        font-size: 14px;

        animation: subirCoracao 11s linear infinite;
      }

      .coracao:nth-child(1) {
        left: 8%;
        animation-duration: 12s;
      }

      .coracao:nth-child(2) {
        left: 20%;
        animation-duration: 10s;
        animation-delay: 2s;
      }

      .coracao:nth-child(3) {
        left: 34%;
        animation-duration: 13s;
        animation-delay: 4s;
      }

      .coracao:nth-child(4) {
        left: 48%;
        animation-duration: 11s;
        animation-delay: 1s;
      }

      .coracao:nth-child(5) {
        left: 62%;
        animation-duration: 14s;
        animation-delay: 5s;
      }

      .coracao:nth-child(6) {
        left: 75%;
        animation-duration: 10s;
        animation-delay: 3s;
      }

      .coracao:nth-child(7) {
        left: 88%;
        animation-duration: 13s;
        animation-delay: 6s;
      }

      .coracao:nth-child(8) {
        left: 55%;
        animation-duration: 15s;
        animation-delay: 7s;
      }

      .coracao:nth-child(9) {
        left: 27%;
        animation-duration: 12s;
        animation-delay: 8s;
      }

      .coracao:nth-child(10) {
        left: 94%;
        animation-duration: 11s;
        animation-delay: 4s;
      }

      @keyframes subirCoracao {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 0;
        }

        20% {
          opacity: 0.45;
        }

        50% {
          transform: translateY(-50vh) translateX(15px) rotate(8deg);
        }

        100% {
          transform: translateY(-115vh) translateX(-15px) rotate(-8deg);
          opacity: 0;
        }
      }

      /* =====================================================
       CONTEÚDO
    ===================================================== */

      .conteudo {
        position: relative;

        z-index: 10;

        width: min(700px, 88vw);

        display: flex;

        flex-direction: column;

        align-items: center;

        animation: entradaConteudo 1.4s cubic-bezier(0.22, 1, 0.36, 1);
      }

      @keyframes entradaConteudo {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.97);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .informacoes {
        text-align: center;

        color: #f7dfaa;

        margin-bottom: 18px;

        text-shadow: 0 3px 18px rgba(0, 0, 0, 0.8);

        transition: opacity 0.65s ease, transform 0.65s ease;
      }

      .informacoes.saindo {
        opacity: 0;
        transform: translateY(-10px);
      }

      .idade {
        font-size: 34px;

        font-weight: normal;

        letter-spacing: 2px;
      }

      .ano {
        margin-top: 5px;

        color: #d8b467;

        font-size: 13px;

        letter-spacing: 5px;
      }

      .moldura {
        position: relative;

        width: 330px;
        height: 330px;

        padding: 11px;

        display: flex;

        justify-content: center;
        align-items: center;

        background: linear-gradient(
          135deg,
          #f4d486 0%,
          #916421 30%,
          #e4bb63 55%,
          #78501c 80%,
          #f0cc78 100%
        );

        box-shadow: 0 28px 65px rgba(0, 0, 0, 0.72),
          0 0 28px rgba(220, 180, 90, 0.18);

        transition: width 1s ease, height 1s ease;
      }

      .foto {
        position: absolute;

        top: 11px;
        left: 11px;

        width: calc(100% - 22px);
        height: calc(100% - 22px);

        object-fit: contain;

        object-position: center;

        background: #0b0806;

        padding: 5px;

        opacity: 0;

        transform: scale(1.04);

        filter: brightness(0.82) sepia(0.1);

        transition: opacity 1.15s ease, transform 2.6s ease, filter 1.3s ease;
      }

      .foto.ativa {
        opacity: 1;

        transform: scale(1);

        filter: brightness(1) sepia(0);
      }

      .foto.saindo {
        opacity: 0;

        transform: scale(0.97);
      }

      .barra-area {
        width: 65%;

        max-width: 420px;

        margin-top: 24px;
      }

      .barra-container {
        position: relative;

        width: 100%;

        height: 4px;

        overflow: hidden;

        border-radius: 20px;

        background: rgba(255, 255, 255, 0.13);

        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      }

      #barra {
        width: 0%;

        height: 100%;

        border-radius: 20px;

        background: linear-gradient(
          90deg,
          #8c6325,
          #d9ad55,
          #f6d88d,
          #d9ad55,
          #8c6325
        );

        box-shadow: 0 0 10px rgba(235, 190, 90, 0.65);

        transition: width 1.2s ease;
      }

      .botao-final {
        position: fixed;

        left: 50%;

        bottom: 32px;

        transform: translateX(-50%) translateY(25px);

        z-index: 20;

        padding: 13px 30px;

        border: 1px solid rgba(255, 220, 150, 0.48);

        border-radius: 40px;

        background: rgba(0, 0, 0, 0.3);

        backdrop-filter: blur(8px);

        color: #f7dca0;

        font-family: Georgia, "Times New Roman", serif;

        font-size: 14px;

        letter-spacing: 1.5px;

        cursor: pointer;

        opacity: 0;

        pointer-events: none;

        transition: opacity 1s ease, transform 1s ease, background 0.3s ease,
          box-shadow 0.3s ease;
      }

      .botao-final.mostrar {
        opacity: 1;

        pointer-events: auto;

        transform: translateX(-50%) translateY(0);
      }

      .botao-final:hover {
        background: rgba(255, 220, 150, 0.12);

        box-shadow: 0 0 20px rgba(235, 190, 100, 0.25);
      }

      .timeline.saindo {
        opacity: 0;

        transition: opacity 1.5s ease;
      }

      @media (max-width: 700px) {
        .conteudo {
          width: 88vw;
        }

        .idade {
          font-size: 28px;
        }

        .ano {
          font-size: 11px;
          letter-spacing: 4px;
        }

        .moldura {
          max-width: 90vw;
          max-height: 52vh;
        }

        .barra-area {
          width: 70%;
          max-width: 330px;
        }

        .botao-final {
          font-size: 12px;

          padding: 12px 24px;

          white-space: nowrap;
        }
      }

      @media (max-height: 700px) {
        .informacoes {
          margin-bottom: 10px;
        }

        .idade {
          font-size: 25px;
        }

        .ano {
          margin-top: 3px;
        }

        .moldura {
          max-height: 48vh;
        }

        .barra-area {
          margin-top: 15px;
        }

        .botao-final {
          bottom: 18px;
        }
      }
    </style>
  </head>

  <body>
    <!-- =====================================================
       MÚSICA CONTÍNUA
  ===================================================== -->

    <audio id="musica" loop preload="auto">
      <source src="musicas/aniversario.mp3" type="audio/mpeg" />
    </audio>

    <div class="timeline" id="timeline">
      <div class="confetes">
        <span class="confete"></span>
        <span class="confete"></span>
        <span class="confete"></span>
        <span class="confete"></span>
        <span class="confete"></span>
        <span class="confete"></span>
        <span class="confete"></span>
        <span class="confete"></span>
      </div>

      <div class="coracoes">
        <span class="coracao">♥</span>
        <span class="coracao">♥</span>
        <span class="coracao">♥</span>
        <span class="coracao">♥</span>
        <span class="coracao">♥</span>
        <span class="coracao">♥</span>
        <span class="coracao">♥</span>
        <span class="coracao">♥</span>
        <span class="coracao">♥</span>
        <span class="coracao">♥</span>
      </div>

      <main class="conteudo">
        <div class="informacoes" id="informacoes">
          <div class="idade" id="idade">0 anos</div>
          <div class="ano" id="ano">2006</div>
        </div>

        <div class="moldura" id="moldura"></div>

        <div class="barra-area">
          <div class="barra-container">
            <div id="barra"></div>
          </div>
        </div>
      </main>

      <button class="botao-final" id="botao">Continuar →</button>
    </div>

    <script>
      /* =====================================================
       MÚSICA CONTÍNUA
    ===================================================== */

      const musica = document.getElementById("musica");

      musica.volume = 0.35;

      const POSICAO_MUSICA = "posicaoMusica";

      function salvarMusica() {
        if (musica.readyState >= 2 && !isNaN(musica.currentTime)) {
          sessionStorage.setItem(POSICAO_MUSICA, musica.currentTime);
        }
      }

      function restaurarMusica() {
        const posicao = sessionStorage.getItem(POSICAO_MUSICA);

        if (posicao !== null) {
          musica.addEventListener(
            "loadedmetadata",
            () => {
              try {
                musica.currentTime = parseFloat(posicao);
              } catch (e) {}
            },
            { once: true }
          );
        }

        musica.play().catch(() => {
          console.log("O navegador bloqueou o autoplay com som.");
        });
      }

      window.addEventListener("load", restaurarMusica);

      setInterval(salvarMusica, 500);

      window.addEventListener("pagehide", salvarMusica);

      /* =====================================================
       FOTOS
    ===================================================== */

      const momentos = [
        {
          idade: 0,
          ano: 2006,
          foto: "fotos/00i.png",
        },

        {
          idade: 1,
          ano: 2007,
          foto: "fotos/01i.png",
        },

        {
          idade: 2,
          ano: 2008,
          foto: "fotos/02i.png",
        },

        {
          idade: 3,
          ano: 2009,
          foto: "fotos/03i.png",
        },

        {
          idade: 4,
          ano: 2010,
          foto: "fotos/04i.png",
        },

        {
          idade: 5,
          ano: 2011,
          foto: "fotos/05i.png",
        },

        {
          idade: 6,
          ano: 2012,
          foto: "fotos/06i.png",
        },

        {
          idade: 7,
          ano: 2013,
          foto: "fotos/07i.png",
        },

        {
          idade: 8,
          ano: 2014,
          foto: "fotos/08i.png",
        },

        {
          idade: 9,
          ano: 2015,
          foto: "fotos/09i.png",
        },

        {
          idade: 10,
          ano: 2016,
          foto: "fotos/10i.png",
        },

        {
          idade: 11,
          ano: 2017,
          foto: "fotos/11i.png",
        },

        {
          idade: 12,
          ano: 2018,
          foto: "fotos/12i.png",
        },

        {
          idade: 13,
          ano: 2019,
          foto: "fotos/13i.png",
        },

        {
          idade: 14,
          ano: 2020,
          foto: "fotos/14i.png",
        },

        {
          idade: 15,
          ano: 2021,
          foto: "fotos/15i.png",
        },

        {
          idade: 16,
          ano: 2022,
          foto: "fotos/16i.png",
        },

        {
          idade: 17,
          ano: 2023,
          foto: "fotos/17i.png",
        },

        {
          idade: 18,
          ano: 2024,
          foto: "fotos/18i.png",
        },

        {
          idade: 19,
          ano: 2025,
          foto: "fotos/19i.png",
        },

        {
          idade: 20,
          ano: 2026,
          foto: "fotos/20i.png",
        },
      ];

      const timeline = document.getElementById("timeline");

      const moldura = document.getElementById("moldura");

      const idade = document.getElementById("idade");

      const ano = document.getElementById("ano");

      const barra = document.getElementById("barra");

      const informacoes = document.getElementById("informacoes");

      const botao = document.getElementById("botao");

      let atual = 0;

      let intervalo = null;

      let finalizado = false;

      const velocidade = 3000;

      function ajustarMoldura(imagem) {
        if (!imagem || !imagem.naturalWidth || !imagem.naturalHeight) {
          return;
        }

        const alturaMaxima = 500;

        const larguraMaxima = 600;

        const proporcao = imagem.naturalWidth / imagem.naturalHeight;

        let largura;

        let altura;

        if (proporcao >= 1) {
          largura = Math.min(larguraMaxima, alturaMaxima * proporcao);

          altura = largura / proporcao;
        } else {
          altura = Math.min(alturaMaxima, larguraMaxima / proporcao);

          largura = altura * proporcao;
        }

        largura += 22;

        altura += 22;

        const limiteLargura = window.innerWidth * 0.9;

        const limiteAltura = window.innerHeight * 0.6;

        if (largura > limiteLargura) {
          const fator = limiteLargura / largura;

          largura *= fator;

          altura *= fator;
        }

        if (altura > limiteAltura) {
          const fator = limiteAltura / altura;

          largura *= fator;

          altura *= fator;
        }

        moldura.style.width = `${largura}px`;

        moldura.style.height = `${altura}px`;
      }

      function atualizar() {
        const momento = momentos[atual];

        informacoes.classList.add("saindo");

        setTimeout(() => {
          idade.textContent = `${momento.idade} anos`;

          ano.textContent = momento.ano;

          informacoes.classList.remove("saindo");
        }, 300);

        const progresso = (momento.idade / 20) * 100;

        barra.style.width = `${progresso}%`;

        if (momento.idade >= 17) {
          timeline.classList.add("quente");
        } else {
          timeline.classList.remove("quente");
        }
      }

      momentos.forEach((momento, index) => {
        const imagem = document.createElement("img");

        imagem.src = momento.foto;

        imagem.alt = `${momento.idade} anos`;

        imagem.classList.add("foto");

        if (index === 0) {
          imagem.classList.add("ativa");
        }

        imagem.addEventListener("load", () => {
          if (index === atual) {
            ajustarMoldura(imagem);
          }
        });

        imagem.addEventListener("error", () => {
          console.warn("Foto não encontrada:", momento.foto);
        });

        moldura.appendChild(imagem);
      });

      const fotos = document.querySelectorAll(".foto");

      atualizar();

      if (fotos[0].complete && fotos[0].naturalWidth) {
        ajustarMoldura(fotos[0]);
      }

      function proximaFoto() {
        if (finalizado) {
          return;
        }

        if (atual === fotos.length - 1) {
          finalizar();

          return;
        }

        fotos[atual].classList.remove("ativa");

        fotos[atual].classList.add("saindo");

        setTimeout(() => {
          atual++;

          fotos[atual].classList.remove("saindo");

          fotos[atual].classList.add("ativa");

          if (fotos[atual].complete && fotos[atual].naturalWidth) {
            ajustarMoldura(fotos[atual]);
          } else {
            fotos[atual].addEventListener(
              "load",
              () => {
                ajustarMoldura(fotos[atual]);
              },
              {
                once: true,
              }
            );
          }

          atualizar();
        }, 750);
      }

      function finalizar() {
        if (finalizado) {
          return;
        }

        finalizado = true;

        clearInterval(intervalo);

        setTimeout(() => {
          botao.classList.add("mostrar");
        }, 1200);
      }

      botao.addEventListener("click", () => {
        salvarMusica();

        timeline.classList.add("saindo");

        setTimeout(() => {
          window.location.href = "carta.html";
        }, 1500);
      });

      intervalo = setInterval(proximaFoto, velocidade);

      window.addEventListener("resize", () => {
        if (fotos[atual] && fotos[atual].naturalWidth) {
          ajustarMoldura(fotos[atual]);
        }
      });
    </script>
  </body>
</html>
