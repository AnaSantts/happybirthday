<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Uma História</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Georgia", serif;
      }

      body {
        height: 100vh;
        overflow: hidden;

        background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)),
          url("fotos/fundo.jpg");

        background-size: cover;
        background-position: center;

        color: white;
      }

      /* =====================================================
       PARTÍCULAS / CONFETES
    ===================================================== */

      .particulas {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 1;
      }

      .particulas span {
        position: absolute;

        top: -20px;

        width: 7px;
        height: 12px;

        background: #e8c76b;

        border-radius: 2px;

        opacity: 0.65;

        animation: cair 9s linear infinite;
      }

      .particulas span:nth-child(1) {
        left: 8%;
        animation-duration: 9s;
        animation-delay: 0s;
      }

      .particulas span:nth-child(2) {
        left: 20%;
        animation-duration: 12s;
        animation-delay: 2s;
      }

      .particulas span:nth-child(3) {
        left: 33%;
        animation-duration: 10s;
        animation-delay: 4s;
      }

      .particulas span:nth-child(4) {
        left: 47%;
        animation-duration: 13s;
        animation-delay: 1s;
      }

      .particulas span:nth-child(5) {
        left: 61%;
        animation-duration: 11s;
        animation-delay: 3s;
      }

      .particulas span:nth-child(6) {
        left: 73%;
        animation-duration: 14s;
        animation-delay: 5s;
      }

      .particulas span:nth-child(7) {
        left: 85%;
        animation-duration: 10s;
        animation-delay: 2s;
      }

      .particulas span:nth-child(8) {
        left: 94%;
        animation-duration: 15s;
        animation-delay: 6s;
      }

      @keyframes cair {
        0% {
          transform: translateY(-20px) rotate(0deg);
          opacity: 0;
        }

        10% {
          opacity: 0.65;
        }

        50% {
          transform: translateY(50vh) translateX(12px) rotate(180deg);
        }

        90% {
          opacity: 0.4;
        }

        100% {
          transform: translateY(110vh) translateX(-10px) rotate(360deg);
          opacity: 0;
        }
      }

      .container {
        position: relative;
        z-index: 5;

        height: 100vh;

        display: flex;

        justify-content: center;

        align-items: center;

        text-align: center;

        flex-direction: column;

        animation: aparecer 3s ease;
      }

      h1 {
        font-size: 55px;

        letter-spacing: 3px;

        margin-bottom: 30px;

        animation: brilho 3s infinite alternate;
      }

      p {
        font-size: 25px;

        max-width: 700px;

        line-height: 1.5;

        color: #ddd;
      }

      button {
        margin-top: 50px;

        padding: 18px 50px;

        border: none;

        border-radius: 40px;

        font-size: 20px;

        cursor: pointer;

        background: linear-gradient(45deg, #d4af37, #f7e7a9);

        color: #222;

        transition: 0.5s;
      }

      button:hover {
        transform: scale(1.1);

        box-shadow: 0 0 30px #d4af37;
      }

      @keyframes aparecer {
        from {
          opacity: 0;
          transform: translateY(50px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes brilho {
        from {
          text-shadow: 0 0 10px white;
        }

        to {
          text-shadow: 0 0 40px gold;
        }
      }
    </style>
  </head>

  <body>
    <!-- =====================================================
       MÚSICA
  ===================================================== -->

    <audio id="musica" loop preload="auto">
      <source src="musicas/Photograph - Ed Sheeran1.mp3" type="audio/mpeg" />
    </audio>

    <!-- =====================================================
       CONFETES
  ===================================================== -->

    <div class="particulas">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- =====================================================
       CONTEÚDO
  ===================================================== -->

    <div class="container">
      <h1>Dois séculos da sua história...</h1>

      <p>
        Antes de chegar até aqui, existiram milhares de momentos, sorrisos e
        histórias que fizeram você ser quem é hoje, e cada um desses momentos
        foi muito importante e merecem ser lembrados. Por isso, te convido a uma
        viagem ao passado.
      </p>

      <button onclick="entrar()">Começar viagem</button>
    </div>

    <script>
      /* =====================================================
       MÚSICA CONTÍNUA
    ===================================================== */

      const musica = document.getElementById("musica");

      musica.volume = 0.35;

      const POSICAO_MUSICA = "posicaoMusica";

      function salvarMusica() {
        if (musica.readyState >= 2 && !isNaN(musica.currentTime)) {
          sessionStorage.setItem(POSICAO_MUSICA, musica.currentTime);
        }
      }

      function restaurarMusica() {
        const posicao = sessionStorage.getItem(POSICAO_MUSICA);

        if (posicao !== null) {
          musica.addEventListener(
            "loadedmetadata",
            () => {
              try {
                musica.currentTime = parseFloat(posicao);
              } catch (e) {
                console.log("Não foi possível restaurar a música.");
              }
            },
            { once: true }
          );
        }

        musica.play().catch(() => {
          console.log("O navegador bloqueou o autoplay com som.");
        });
      }

      window.addEventListener("load", restaurarMusica);

      setInterval(salvarMusica, 500);

      window.addEventListener("pagehide", salvarMusica);

      /* =====================================================
       PRÓXIMA PÁGINA
    ===================================================== */

      function entrar() {
        salvarMusica();

        window.location.href = "linha-tempo.html";
      }
    </script>
  </body>
</html>
